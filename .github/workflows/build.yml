name: build
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26.3, как у Feather (самый свежий SDK установщик мог не принять)
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app && xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen
      - name: Сборка без подписи (подпишет GBox)
        run: |
          xcodebuild -project Rasengan.xcodeproj -scheme Rasengan -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build.log 2>&1 || { grep -E 'error:' build.log | sort -u | head -30; exit 1; }
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Rasengan.app Payload/
          chmod -R 0755 Payload/Rasengan.app
          # как Feather: подпись «-» (ad-hoc) с правами, сначала расширение, потом приложение; GBox потом переподпишет своим сертификатом
          codesign --force --sign - --timestamp=none --entitlements Broadcast/Broadcast.entitlements Payload/Rasengan.app/PlugIns/Broadcast.appex
          codesign --force --sign - --timestamp=none --entitlements App/Rasengan.entitlements Payload/Rasengan.app
          ditto -c -k --sequesterRsrc --keepParent Payload Rasengan.ipa
      - name: Релиз
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "b${{ github.run_number }}" Rasengan.ipa --title "Сборка ${{ github.run_number }}" --notes "" --latest
