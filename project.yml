name: Rasengan
options:
  bundleIdPrefix: dev.sufler
  deploymentTarget:
    iOS: "16.0"
packages:
  DivKit:
    url: https://github.com/divkit/divkit-ios.git
    from: 33.9.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rasengan:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base: {PRODUCT_BUNDLE_IDENTIFIER: dev.sufler.rasengan}
    entitlements:
      path: App/Rasengan.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sufler.rasengan]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Расенган
        NSMicrophoneUsageDescription: Микрофон нужен для голосового ответа в суфлёре
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SuflerURL: https://sufler.devml4dbs.duckdns.org/talk
    dependencies:
      - target: Broadcast
        embed: true
      - package: DivKit
        product: DivKit
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast]
    settings:
      base: {PRODUCT_BUNDLE_IDENTIFIER: dev.sufler.rasengan.Broadcast}
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.sufler.rasengan]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Расенган звук
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
